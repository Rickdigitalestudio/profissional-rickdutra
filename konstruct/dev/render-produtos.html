<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>KONSTRUCT — render das imagens de produto</title>
<style>
  body{margin:0;background:#0a0b0e;color:#e9ecf2;font-family:system-ui,sans-serif}
  #stage{display:block;width:720px;height:720px;margin:0 auto}
  #log{position:fixed;left:8px;top:8px;font:11px monospace;color:#8d95a6;white-space:pre;z-index:9}
</style>
</head>
<body>
<canvas id="stage" width="720" height="720"></canvas>
<div id="log">iniciando…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/data.js?v=13"></script>
<script src="js/models.js?v=13"></script>
<script>
/* Renderiza o modelo 3D de cada produto e baixa a imagem como JPEG.
   É esta imagem que aparece no card, no carrinho e na vitrine. */
(function () {
  var T = window.THREE;
  var canvas = document.getElementById('stage');
  var SIZE = 720;

  var renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(SIZE, SIZE, false);
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;

  var scene = new T.Scene();
  var camera = new T.PerspectiveCamera(34, 1, .1, 60);

  /* ambiente */
  var pm = new T.PMREMGenerator(renderer);
  pm.compileEquirectangularShader();
  var ec = document.createElement('canvas'); ec.width = 512; ec.height = 256;
  var ctx = ec.getContext('2d');
  var g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#4a5670'); g.addColorStop(.42, '#1b2028');
  g.addColorStop(.6, '#0d1015'); g.addColorStop(1, '#06070a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 256);
  function soft(x, y, w, h, col) {
    var rg = ctx.createRadialGradient(x, y, 0, x, y, Math.max(w, h) / 2);
    rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(x - w / 2, y - h / 2, w, h);
  }
  soft(150, 45, 260, 170, 'rgba(255,246,228,.95)');
  soft(380, 85, 200, 150, 'rgba(255,200,110,.6)');
  soft(256, 225, 470, 140, 'rgba(80,110,170,.3)');
  var envTex = new T.CanvasTexture(ec);
  envTex.mapping = T.EquirectangularReflectionMapping;
  scene.environment = pm.fromEquirectangular(envTex).texture;

  /* luzes de estúdio */
  scene.add(new T.HemisphereLight(0xdfe9ff, 0x171a21, .9));
  var key = new T.DirectionalLight(0xfff4e0, 2.6);
  key.position.set(3.2, 4.4, 3.2);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = .5; key.shadow.camera.far = 16;
  key.shadow.camera.left = -2.4; key.shadow.camera.right = 2.4;
  key.shadow.camera.top = 2.4; key.shadow.camera.bottom = -2.4;
  key.shadow.bias = -.0012;
  scene.add(key);
  var fill = new T.PointLight(0x9fc2ff, 1.1, 16, 2);
  fill.position.set(-3, 1.6, 2); scene.add(fill);
  var rim = new T.PointLight(0xffc23f, 2.4, 14, 2);
  rim.position.set(1.2, 1.8, -3); scene.add(rim);

  /* fundo do card (radial escuro) */
  var bg = document.createElement('canvas');
  bg.width = bg.height = SIZE;
  var bctx = bg.getContext('2d');
  var rg2 = bctx.createRadialGradient(SIZE * .5, SIZE * .40, 30, SIZE * .5, SIZE * .5, SIZE * .66);
  rg2.addColorStop(0, '#2a313d'); rg2.addColorStop(.5, '#181d25'); rg2.addColorStop(1, '#0c0f14');
  bctx.fillStyle = rg2; bctx.fillRect(0, 0, SIZE, SIZE);
  /* brilho sutil no piso */
  var rg3 = bctx.createRadialGradient(SIZE * .5, SIZE * .78, 10, SIZE * .5, SIZE * .78, SIZE * .45);
  rg3.addColorStop(0, 'rgba(245,179,1,.10)'); rg3.addColorStop(1, 'rgba(0,0,0,0)');
  bctx.fillStyle = rg3; bctx.fillRect(0, 0, SIZE, SIZE);
  var bgTex = new T.CanvasTexture(bg);
  if ('encoding' in bgTex) bgTex.encoding = T.sRGBEncoding;
  var bgMesh = new T.Mesh(new T.PlaneGeometry(30, 30), new T.MeshBasicMaterial({ map: bgTex, fog: false }));
  bgMesh.position.z = -9;
  scene.add(bgMesh);

  /* chão com sombra */
  var ground = new T.Mesh(new T.CircleGeometry(4, 48), new T.ShadowMaterial({ opacity: .38 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -1.02; ground.receiveShadow = true;
  scene.add(ground);

  var holder = new T.Group();
  scene.add(holder);

  var log = document.getElementById('log');
  var P = window.KONSTRUCT.P;

  function shoot(product) {
    if (holder.children.length) {
      var old = holder.children[0];
      holder.remove(old);
      window.KModel.dispose(old);
    }
    var m = window.KModel.build(product, 1.9);
    if (!m) return null;
    var half = m.userData.halfHeight || 1;
    var radius = m.userData.radius || 1;
    m.position.y = half - 1.02;
    m.rotation.y = 0.62;
    holder.add(m);
    m.traverse(function (o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

    /* enquadra pelo tamanho real do modelo */
    var centerY = m.position.y;
    var fov = camera.fov * Math.PI / 180;
    var dist = (radius / Math.tan(fov / 2)) * 1.18;
    camera.position.set(0, centerY + radius * 0.12, dist);
    camera.lookAt(0, centerY, 0);
    renderer.render(scene, camera);

    /* envia a imagem direto para o servidor local */
    var dataUrl = canvas.toDataURL('image/jpeg', 0.9);
    var b64 = dataUrl.split(',')[1];
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var path = 'konstruct/assets/p-' + product.id + '.jpg';
    var payload = new Blob([path, new Uint8Array([10]), arr]);
    fetch('/__upload', { method: 'POST', body: payload })
      .then(function (r) { return r.text(); })
      .then(function () { log.textContent = 'enviado: ' + path; });

    return dataUrl.length;
  }

  window.__shoot = shoot;
  window.__shootAll = function () {
    var out = [];
    for (var i = 0; i < P.length; i++) {
      try { var n = shoot(P[i]); out.push(P[i].id + ':' + n); }
      catch (e) { out.push(P[i].id + ':ERRO ' + e.message); }
      log.textContent = (i + 1) + '/' + P.length + ' — ' + P[i].n + '\n' + out.slice(-6).join('\n');
    }
    log.textContent = 'CONCLUIDO ' + P.length + ' produtos\n' + out.join('\n');
    window.__done = true;
    return out.length;
  };
  log.textContent = 'pronto — ' + P.length + ' produtos';
})();
</script>
</body>
</html>
